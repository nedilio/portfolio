<!doctype html>

  /* ---------- OG card 1200x630 ---------- */
  .og {

  .og .b3 { width: 420px; height: 420px; left: 380px; bottom: -260px; background: rgba(249, 168, 212, .45); }
  .og .grid {
    position: absolute; inset: 0;

    position: relative; height: 100%; border-radius: 40px; padding: 56px 60px;
    background: rgba(255,255,255,.55); border: 1.5px solid rgba(255,255,255,.85);

  }
  .og .top { display: flex; justify-content: space-between; align-items: center; }
  .og .pill {
    font-family: 'Geist Mono', monospace; font-size: 20px; text-transform: uppercase; letter-spacing: .08em;

  .og .domain { font-family: 'Geist Mono', monospace; font-size: 24px; color: #4d5a49; }
  .og h1 { font-size: 92px; line-height: .98; letter-spacing: -.035em; font-weight: 700; }
  .og h1 .dot { color: #84cc16; }
  .og .role { font-size: 36px; color: #5d665b; margin-top: 14px; letter-spacing: -.01em; }
  .og .stack { display: flex; gap: 12px; }
  .og .stack span {
